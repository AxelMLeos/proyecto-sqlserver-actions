name: Deploy SQL Server Database

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-mssql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar contenedor de SQL Server
        run: |
          docker run -e "ACCEPT_EULA=Y" -e "MSSQL_PID=Developer" -e "MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}" -p 1433:1433 -d --name mssql mcr.microsoft.com/mssql/server:2019-latest
          
      - name: Esperar a que el servicio esté listo
        run: sleep 20

      - name: Ejecutar scripts SQL de inicialización
        run: |
          docker exec -i mssql /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" -i - < sql/create_database.sql
          docker exec -i mssql /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" -i - < sql/create_tables.sql
          docker exec -i mssql /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" -i - < sql/create_procedure.sql
          docker exec -i mssql /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" -i - < sql/create_trigger.sql
          docker exec -i mssql /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" -i - < sql/test_data.sql
